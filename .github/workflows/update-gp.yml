# Mirrors CelesTrak orbital elements for comm-cockpit.html into the gp-data branch.
# The page reads this copy first, so visitors do not hit CelesTrak's per-address limit.
# gp-data is rewritten as a single commit each run, so the repository does not grow.
name: Update orbital data mirror
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/update-gp.yml']
permissions:
  contents: write
concurrency:
  group: gp-data
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start from the previous copy
        run: |
          git clone --depth 1 --branch gp-data "https://github.com/${GITHUB_REPOSITORY}.git" prev || mkdir prev
          mkdir out
          cp prev/*.csv prev/meta.json out/ 2>/dev/null || true
      - name: Fetch from CelesTrak
        run: |
          python3 - <<'PY'
          import csv, io, json, os, time, urllib.request, datetime
          GROUPS = ['geo','ses','iridium-NEXT','globalstar','orbcomm','oneweb','kuiper','qianfan','hulianwang','starlink']
          KEEP = ['OBJECT_NAME','NORAD_CAT_ID','EPOCH','MEAN_MOTION','ECCENTRICITY','INCLINATION','RA_OF_ASC_NODE','ARG_OF_PERICENTER','MEAN_ANOMALY','MEAN_MOTION_DOT']
          try:
              meta = json.load(open('out/meta.json'))
          except Exception:
              meta = {'groups': {}}
          ok = 0
          for g in GROUPS:
              url = 'https://celestrak.org/NORAD/elements/gp.php?GROUP=%s&FORMAT=csv' % g
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'gp-mirror (GitHub Actions)'})
                  text = urllib.request.urlopen(req, timeout=60).read().decode('utf-8')
                  rows = list(csv.DictReader(io.StringIO(text)))
                  if not rows or any(k not in rows[0] for k in KEEP):
                      raise ValueError('unexpected content')
                  with open('out/%s.csv' % g, 'w', newline='') as f:
                      w = csv.writer(f, lineterminator='\n')
                      w.writerow(KEEP)
                      for r in rows:
                          w.writerow([r[k] for k in KEEP])
                  now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
                  meta['groups'][g] = {'at': now, 'rows': len(rows)}
                  ok += 1
                  print(g, 'ok', len(rows))
              except Exception as e:
                  print(g, 'kept previous copy:', e)
              time.sleep(3)
          meta['checked'] = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          json.dump(meta, open('out/meta.json', 'w'), indent=1)
          print('updated', ok, 'of', len(GROUPS))
          PY
      - name: Publish to gp-data
        run: |
          cd out
          ls *.csv >/dev/null 2>&1 || { echo "no data fetched"; exit 1; }
          git init -q -b gp-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Orbital data mirror $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gp-data
